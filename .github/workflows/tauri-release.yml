name: Tauri Desktop App Release

on:
  push:
    tags:
      - 'app-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. app-v0.2.0'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'
  GO_VERSION: '1.23'

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Setup Node (for Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.0.0

      - name: Compile Go sidecar
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w" -o src-tauri/binaries/m365-copilot2api-x86_64-pc-windows-msvc.exe ./cmd/server
        shell: pwsh

      - name: Generate icons (pure Go, no Python needed)
        run: go run scripts/generate_icons.go
        shell: pwsh

      - name: Build Tauri App
        run: |
          cd src-tauri
          cargo tauri build --bundles nsis --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.0.0

      - name: Compile Go sidecar
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" \
            -o src-tauri/binaries/m365-copilot2api-x86_64-unknown-linux-gnu \
            ./cmd/server

      - name: Generate icons (pure Go, no Python needed)
        run: go run scripts/generate_icons.go

      - name: Build Tauri App
        run: |
          cd src-tauri
          cargo tauri build --bundles appimage,deb --target x86_64-unknown-linux-gnu

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.0.0

      - name: Compile Go sidecar (universal)
        run: |
          # x86_64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" \
            -o src-tauri/binaries/m365-copilot2api-x86_64-apple-darwin \
            ./cmd/server
          # arm64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" \
            -o src-tauri/binaries/m365-copilot2api-aarch64-apple-darwin \
            ./cmd/server

      - name: Generate icons (pure Go, no Python needed)
        run: go run scripts/generate_icons.go

      - name: Build Tauri App
        run: |
          cd src-tauri
          cargo tauri build --bundles dmg --target universal

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish Desktop App Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: '*'

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} \; > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Desktop App ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: false
