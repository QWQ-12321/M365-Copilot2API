<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M365 Copilot2API</title>
  <style>
    :root {
      --primary: #0078d4;
      --bg: #f3f2f1;
      --surface: #ffffff;
      --text: #242424;
      --text-secondary: #605e5c;
      --border: #e0e0e0;
      --success: #107c10;
      --error: #d13438;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; -webkit-app-region: no-drag; }
    .status-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      -webkit-app-region: no-drag;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #aaa;
      display: inline-block;
    }
    .dot.ready { background: var(--success); }
    .dot.error { background: var(--error); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: var(--surface);
    }
    #loader {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--surface);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: var(--text-secondary); font-size: 14px; }
    .error-msg {
      color: var(--error);
      font-size: 13px;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { opacity: 0.9; }
    footer {
      padding: 6px 24px;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="1" width="18" height="18" rx="4" fill="#fff" opacity="0.9"/>
      <path d="M5 7h10M5 10h7M5 13h4" stroke="#0078d4" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>M365 Copilot2API</h1>
    <div class="status-bar">
      <span class="dot" id="dot"></span>
      <span id="status-text">正在启动…</span>
    </div>
  </header>

  <main>
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text" id="loader-text">正在启动本地服务器…</div>
    </div>
    <iframe id="frame" style="display:none" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
  </main>

  <footer>
    <span id="footer-url">http://127.0.0.1:—</span>
    <span id="footer-ver">M365 Copilot2API v0.2.0</span>
  </footer>

  <script>
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const frame = document.getElementById('frame');
    const footerUrl = document.getElementById('footer-url');

    // Tauri 事件监听
    const { invoke, listen } = window.__TAURI__ || {};

    let port = null;

    async function init() {
      try {
        if (invoke) {
          // 在 Tauri 环境中运行
          port = await invoke('get_port');
          footerUrl.textContent = `http://127.0.0.1:${port}`;

          // 监听服务器就绪
          await listen('server-ready', () => {
            showAdmin(port);
          });

          await listen('server-error', (e) => {
            showError(e.payload || '服务器启动失败');
          });

          // 超时兜底
          setTimeout(() => {
            if (loader.style.display !== 'none') {
              showError('服务器启动超时，请检查日志');
            }
          }, 20000);
        } else {
          // 浏览器直接访问 — 直接加载
          port = 4141;
          footerUrl.textContent = `http://127.0.0.1:${port}`;
          showAdmin(port);
        }
      } catch (e) {
        showError('初始化失败: ' + (e?.message || e));
      }
    }

    function showAdmin(p) {
      dot.className = 'dot ready';
      statusText.textContent = '运行中';
      loader.style.display = 'none';
      frame.style.display = 'block';
      frame.src = `http://127.0.0.1:${p}/`;
      loaderText.textContent = '服务器已就绪';
    }

    function showError(msg) {
      dot.className = 'dot error';
      statusText.textContent = '异常';
      loader.innerHTML = '';
      const err = document.createElement('div');
      err.className = 'error-msg';
      err.innerHTML = `<strong>服务器启动失败</strong><br><br>${msg}<br><br>请检查系统托盘菜单中的日志选项，或尝试重启应用。`;
      loader.appendChild(err);
      const retry = document.createElement('button');
      retry.className = 'btn';
      retry.textContent = '在浏览器中打开';
      retry.onclick = () => {
        if (invoke) invoke('open_in_browser', { port: port || 4141 });
        else window.open(`http://127.0.0.1:${port || 4141}`, '_self');
      };
      loader.appendChild(retry);
    }

    init();
  </script>
</body>
</html>
